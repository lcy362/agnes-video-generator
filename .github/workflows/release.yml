name: Release

# 触发：推送 v* 标签（如 v4.0.0）自动构建多平台镜像并发布
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

# 权限最小化：仅在需要写权限的 job 上按需授予（S8233）
permissions:
  contents: read

env:
  IMAGE_NAME: free-short-video
  DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: write      # 创建 GitHub Release
      packages: write      # 推送 GHCR
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4

      # ── 版本号同步：更新 docker-compose.yml 中的镜像 tag ──
      - name: Bump version references in project files
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "Bumping project files to version $VERSION"
          # 更新 docker-compose.yml 中的镜像 tag
          sed -i "s|free-short-video:[0-9.]*$|free-short-video:${VERSION}|g" docker-compose.yml
          sed -i "s|free-short-video:[0-9.]*|free-short-video:${VERSION}|" docker-compose.yml
          # 更新 AGENTS.md 中的示例版本号（仅文档示例，保持最新）
          sed -i "s|v[0-9]\+\.[0-9]\+\.[0-9]\+ →|v${VERSION} →|g" AGENTS.md
          echo "Updated files:"
          grep -n "free-short-video:[0-9]" docker-compose.yml || true
          grep -n "v[0-9]" AGENTS.md | head -5 || true

      - name: Set up QEMU（多架构模拟）
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130  # v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f  # v3

      # ── 冒烟测试：本地构建单平台镜像并验证服务可启动 ──
      - name: Build image for smoke test
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25  # v5
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: ${{ env.IMAGE_NAME }}:smoke
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test (start container, probe endpoints)
        run: |
          docker run -d -p 8765:8765 -e AGNES_API_KEY=smoke-test-key --name fsv-smoke ${{ env.IMAGE_NAME }}:smoke
          code=""
          for i in $(seq 1 20); do
            code=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8765/ || true)
            [ "$code" = "200" ] && break
            sleep 2
          done
          echo "GET / => $code"
          cfg=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8765/api/config)
          echo "GET /api/config => $cfg"
          docker logs fsv-smoke 2>&1 | tail -20
          docker stop fsv-smoke && docker rm fsv-smoke
          if [ "$code" != "200" ]; then echo "SMOKE TEST FAILED"; exit 1; fi

      # ── GitHub Container Registry（GHCR）──
      # GHCR 命名空间只有 user / org（ghcr.io/OWNER/IMAGE），不存在"仓库级路径"。
      # 用 GITHUB_TOKEN 从 workflow 推送会自动将包关联到仓库、出现在 Packages 页。
      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9  # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051  # v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}
          labels: |
            org.opencontainers.image.title=Free Short Video
          tags: |
            type=semver,pattern={{version}}      # v4.0.0
            type=semver,pattern={{major}}.{{minor}}  # v4.0
            type=raw,value=latest                 # latest

      - name: Build and push to GHCR
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25  # v5
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # ── 同步到 Docker Hub（提升公开曝光）──
      # 在仓库 Settings → Secrets 配置 DOCKERHUB_USERNAME / DOCKERHUB_TOKEN 后生效
      - name: Log in to Docker Hub
        if: ${{ env.DOCKERHUB_USERNAME != '' }}
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9  # v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Push to Docker Hub
        if: ${{ env.DOCKERHUB_USERNAME != '' }}
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25  # v5
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:${{ github.ref_name }}
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:latest

      # ── 同步 Docker Hub 仓库描述与完整说明（README）──
      # Docker Hub 不会从 GitHub 自动同步，这里用 Hub API 把仓库 description + README 填进去。
      - name: Update Docker Hub repository overview
        if: ${{ env.DOCKERHUB_USERNAME != '' }}
        continue-on-error: true
        env:
          DH_USER: ${{ secrets.DOCKERHUB_USERNAME }}
          DH_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          RELEASE_VERSION: ${{ github.ref_name }}
        run: python3 .github/scripts/update_dockerhub_overview.py

      # ── Assemble GitHub Release body: Usage (existing) + What's New (new) ──
      # Usage = how to get/run each release package (Docker / npm)
      # What's New = read from the release notes doc (docs/public/release-notes/)
      # Spec: docs/dev/release_process.md — all release body sections are in English.
      - name: Prepare GitHub Release body
        # secrets 通过 env 注入（S7636：避免在 run 块中直接展开 secrets）
        env:
          DH_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          BODY=/tmp/release_body.md
          cat > "$BODY" <<'EOF'
          ## Usage
          
          ### Docker Image
          
          Multi-arch (`linux/amd64`, `linux/arm64`) images for this release are published to **GHCR** and **Docker Hub**.
          
          #### Pull
          
          GitHub Container Registry (GHCR):
          ```bash
          docker pull ghcr.io/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.version }}
          ```
          
          Docker Hub:
          ```bash
          docker pull __DH_USERNAME__/${{ env.IMAGE_NAME }}:${{ github.ref_name }}
          ```
          
          #### Run
          
          > **Data persistence:** the app writes all generated videos, uploads and settings into `/app/.working_dir` and `/app/.agnes_config` *inside the container*. A plain `docker run` without a volume loses everything when the container is recreated. Mount these paths to your host so outputs survive restarts and can be exported.
          
          **Option A — bind mount to a host folder (recommended; files land directly in the folder):**
          ```bash
          mkdir -p ~/agnes-data/working ~/agnes-data/config
          docker run -d -p 8765:8765 \
            -e AGNES_API_KEY=<your-key> \
            -v ~/agnes-data/working:/app/.working_dir \
            -v ~/agnes-data/config:/app/.agnes_config \
            ghcr.io/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.version }}
          ```
          Your videos will be in `~/agnes-data/working/` on your machine.
          
          **Option B — named Docker volume (no host path needed; survives container recreation):**
          ```bash
          docker volume create agnes-working
          docker volume create agnes-config
          docker run -d -p 8765:8765 \
            -e AGNES_API_KEY=<your-key> \
            -v agnes-working:/app/.working_dir \
            -v agnes-config:/app/.agnes_config \
            ghcr.io/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.version }}
          ```
          Export files from a named volume:
          ```bash
          docker run --rm -v agnes-working:/data -v "$PWD":/out busybox cp -r /data/. /out/agnes-export
          ```
          
          Then open **http://localhost:8765**.
          
          **Notes**
          - Prefer Docker Hub? Replace the image with `__DH_USERNAME__/${{ env.IMAGE_NAME }}:${{ github.ref_name }}`.
          - The image already declares `VOLUME` for both paths, so `docker run -p 8765:8765 <image>` (no `-v`) keeps data only while you reuse the same container (`stop`/`start`); recreating the container starts fresh.
          - `AGNES_API_KEY` can also be set later in the Web UI; it is then stored in the mounted config volume.
          
          ### npm
          
          Use `npx` for a one-shot run or install globally:
          
          ```bash
          # Quick run (no install):
          npx free-short-video
          
          # Global install:
          npm install -g free-short-video
          free-short-video
          ```
          
          > Requires Python 3.10+ and ffmpeg on your system.
          > On first run, a Python virtual environment is auto-created and dependencies are installed.
          EOF
          # 将占位符替换为 Docker Hub 用户名（从 env 读取，避免在 run 中展开 secrets）
          if [ -n "$DH_USERNAME" ]; then
            sed -i "s|__DH_USERNAME__|${DH_USERNAME}|g" "$BODY"
          fi
          # Append the What's New section (from the release notes doc onward)
          NOTES="docs/public/release-notes/release_notes_v${VERSION}.md"
          if [ -f "$NOTES" ]; then
            printf '%s\n' '' '---' '' >> "$BODY"
            awk '/^## What.s New/{f=1} f' "$NOTES" >> "$BODY"
          else
            echo "::warning::Missing release notes doc $NOTES; GitHub Release will only contain Usage."
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65  # v2
        with:
          body_path: /tmp/release_body.md

  # ── npm 包发布（整个项目 = free-short-video）──
  # 与 Docker 镜像同由 v* 标签触发；未配置 NPM_TOKEN 时自动跳过，不影响 Docker 发布。
  # 发布的是仓库根目录的 package.json（files 白名单包含全部 Python 源码 + 字体），
  # 即把整个 Agnes Video Generator 服务作为 npm 包发出，用户 npx 即可本地起服务。
  npm-publish:
    runs-on: ubuntu-latest
    needs: build-and-push
    if: ${{ startsWith(github.ref, 'refs/tags/v') }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4
        with:
          node-version: 22
          registry-url: 'https://registry.npmjs.org'

      - name: Sync version from tag
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          npm pkg set version="$TAG"

      - name: Prepare npm README (add Quick Start + What's New at top)
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          cp README.md /tmp/README.orig.md
          printf '## Quick Start (npm)\n\n```bash\nnpx free-short-video\n```\n\nOr install globally:\n\n```bash\nnpm install -g free-short-video\nfree-short-video\n```\n\n> Requires Python 3.10+ and ffmpeg.\n\n' > /tmp/npm-header.md
          # Prepend the release's What's New section at the front of the npm README
          NOTES="docs/public/release-notes/release_notes_v${VERSION}.md"
          if [ -f "$NOTES" ]; then
            printf '%s\n' '---' '' "# What's New in v${VERSION}" '' > /tmp/npm-rel.md
            awk '/^## What.s New/{f=1} f' "$NOTES" >> /tmp/npm-rel.md
            printf '%s\n' '' '---' '' >> /tmp/npm-rel.md
            cat /tmp/npm-rel.md /tmp/npm-header.md /tmp/README.orig.md > README.md
          else
            echo "::warning::Missing release notes doc $NOTES; npm README will only contain Quick Start."
            cat /tmp/npm-header.md /tmp/README.orig.md > README.md
          fi

      - name: Publish to npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "$NODE_AUTH_TOKEN" ]; then
            echo "NPM_TOKEN secret is not set; skipping npm publish."
            exit 0
          fi
          npm publish --access public
