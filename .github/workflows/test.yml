name: Unit Tests & Coverage

# ════════════════════════════════════════════════════════════
# 单元测试 + 覆盖度分析
#
# 为什么适合 CI：
#   1. tests/mock_regression 在「API 协议边界」处把 AgnesVideo/Image/Chat API、
#      EdgeTTS、限流器全部替换成 Mock，测试不发起任何网络请求、不需要 AGNES_API_KEY。
#   2. 测试依赖的素材（tests/mock_regression/assets/*.mp4|*.png）与
#      fixture 文本（tests/mock_regression/fixture_data/*）已提交进仓库，
#      checkout 后即可用，无需额外生成步骤。
#   3. 唯一外部二进制依赖是 ffmpeg（视频拼接），由 apt 安装；
#      moviepy 也自带 imageio-ffmpeg 静态二进制作为兜底。
#   4. tests/test_core.py 为纯单元（模型/字幕/配置/拼接器），无任何外部依赖。
#
# 触发：push 到任意分支、所有 PR、以及手动触发。
# ════════════════════════════════════════════════════════════

on:
  push:
    branches: [ "**" ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  i18n-check:
    # 1.8：多语言完整性前置检查（en 缺失硬阻断返回 2，其余语言缺失/占位符
    # 不一致列出提醒返回 1；与回归脚本回归前置门槛同一脚本）
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run i18n completeness check
        run: python scripts/i18n_check.py

  test:
    runs-on: ubuntu-latest
    # 3.3：Python 3.10 / 3.12 矩阵（README / start.sh 承诺 3.10+）
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install ffmpeg + CJK font (moviepy 视频拼接 / 字幕中文渲染依赖)
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-noto-cjk

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Lint (ruff)
        run: ruff check core/ web/ utils/ models/ scripts/ --output-format=github

      - name: Setup Node (frontend unit tests)
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm install --no-audit --no-fund

      - name: Run frontend unit tests (vitest)
        working-directory: frontend
        run: npm test

      - name: Type-check + build frontend
        working-directory: frontend
        run: npm run build

      - name: Run tests with coverage
        # --cov-fail-under=55：覆盖率跌破当前基线（58%）即判红，防静默退化。
        # 补完 server.py / config.py 等单测后可逐步上调（目标 65）。
        run: |
          python -m pytest tests/ \
            --cov=core --cov=models --cov=utils \
            --cov-report=term-missing \
            --cov-report=xml:coverage.xml \
            --cov-report=html:htmlcov \
            --cov-fail-under=55

      - name: Publish coverage to job summary
        # 即使 --cov-fail-under 判红（上一步非零退出），本步仍运行，
        # 保证 summary 页面始终展示覆盖率，便于一眼看到退化幅度。
        if: always()
        run: |
          python -m coverage json -o coverage.json
          python - <<'PY'
          import json, os
          data = json.load(open('coverage.json'))
          t = data['totals']
          pct = t['percent_covered']
          covered = t['covered_lines']
          total = t['num_statements']
          missing = t['missing_lines']
          color = 'green' if pct >= 80 else ('yellow' if pct >= 50 else 'red')
          badge = f"https://img.shields.io/badge/coverage-{pct:.1f}%25-{color}"
          lines = []
          lines.append("## 🧪 单元测试覆盖率")
          lines.append("")
          lines.append(f"![coverage]({badge})")
          lines.append("")
          lines.append(f"**总计 {pct:.1f}%** —— 覆盖 {covered}/{total} 条语句，未覆盖 {missing} 条。")
          lines.append("")
          lines.append("| 模块 | 覆盖率 | 语句 | 未覆盖 |")
          lines.append("| --- | --- | --- | --- |")
          for f, info in sorted(data['files'].items(),
                                key=lambda kv: kv[1]['summary']['percent_covered']):
              s = info['summary']
              lines.append(f"| `{f}` | {s['percent_covered']:.1f}% | {s['num_statements']} | {s['missing_lines']} |")
          lines.append("")
          lines.append("> 详细逐行覆盖见上方 `coverage-html` / `coverage-xml` artifact。")
          lines.append("")
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as fh:
              fh.write("\n".join(lines) + "\n")
          PY

      - name: Upload HTML coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-html
          path: htmlcov/
          retention-days: 14

      - name: Upload coverage.xml
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml
          retention-days: 14

  # ── 前端构建校验：确保 frontend/ 源码 build 后与提交的 static/ 产物一致 ──
  # 前端产物（static/index.html + static/assets/）提交进仓库，供 start.sh/Docker/npm 三条链路零依赖使用。
  # 此 job 防止开发者改动 frontend/ 源码后忘记重新 build 提交产物，导致源码与产物脱节。
  frontend-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend deps
        run: npm ci
        working-directory: frontend

      - name: Build frontend
        run: npm run build
        working-directory: frontend

      - name: Check build artifacts are committed (no diff)
        run: |
          if [ -n "$(git status --porcelain static/)" ]; then
            echo "::error::static/ 产物与 frontend/ 源码不一致，请运行 'cd frontend && npm run build' 后提交产物。"
            git status --porcelain static/
            git diff --stat static/
            exit 1
          fi
          echo "✓ frontend 源码与 static/ 产物一致"
