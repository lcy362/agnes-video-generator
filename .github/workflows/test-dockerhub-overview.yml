name: Test Docker Hub Overview

# 仅测试 update_dockerhub_overview.py 脚本（Debug/诊断用），不构建任何镜像。
# 用法：gh workflow run test-dockerhub-overview.yml
on:
  workflow_dispatch:

jobs:
  test-overview:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Round 2 - payload size threshold tests
        env:
          DH_USER: ${{ secrets.DOCKERHUB_USERNAME }}
          DH_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          set -x
          REPO="$DH_USER/free-short-video"
          JWT=$(curl -sS -m 30 -X POST -H "Content-Type: application/json" \
            --data "{\"username\":\"$DH_USER\",\"password\":\"$DH_TOKEN\"}" \
            https://hub.docker.com/v2/users/login | python3 -c "import sys,json;print(json.load(sys.stdin)['token'])")

          # 构造与脚本一致的完整 payload（README + What's New 前置，实际大小）
          python3 - <<'EOF'
          import json
          readme = open("README.md", encoding="utf-8").read()
          lines = readme.split("\n")
          for i, line in enumerate(lines):
              if line.startswith("# ") and "Agnes Video Generator" in line:
                  lines[i] = line.replace("Agnes Video Generator", "free-short-video", 1)
                  break
          readme = "\n".join(lines)
          payload = json.dumps({"description": "free-short-video — Self-hosted AI video generator with subtitles", "full_description": readme})
          with open("/tmp/full.json", "w") as f:
              f.write(payload)
          # 截断版（10KB 与 6KB）
          with open("/tmp/10k.json", "w") as f:
              f.write(payload[:10000] + '"} ')
          with open("/tmp/6k.json", "w") as f:
              f.write(payload[:6000] + '"} ')
          print("full payload size:", len(payload))
          EOF
          wc -c /tmp/full.json /tmp/10k.json /tmp/6k.json

          # Test 5: curl 完整大 payload（复现 403）
          echo "=== Test 5: curl PATCH full payload (~16KB) ==="
          curl -sS -m 60 -o /tmp/t5.txt -w "HTTP %{http_code}\n" -X PATCH \
            -H "Content-Type: application/json" \
            -H "Authorization: JWT $JWT" \
            --data @/tmp/full.json \
            "https://hub.docker.com/v2/repositories/$REPO/"
          head -c 150 /tmp/t5.txt; echo

          # Test 6: curl_cffi 完整大 payload（Chrome TLS 指纹能否过）
          pip install --quiet curl-cffi
          python3 - <<'EOF'
          from curl_cffi import requests as crequests
          import os
          user = os.environ["DH_USER"]
          token = os.environ["DH_TOKEN"]
          r = crequests.post("https://hub.docker.com/v2/users/login",
                             json={"username": user, "password": token},
                             impersonate="chrome", timeout=30)
          jwt = r.json().get("token", "")
          payload = open("/tmp/full.json").read()
          print("payload size:", len(payload))
          r2 = crequests.patch(f"https://hub.docker.com/v2/repositories/{user}/free-short-video/",
                               data=payload,
                               headers={"Content-Type": "application/json",
                                        "Authorization": f"JWT {jwt}"},
                               impersonate="chrome", timeout=60)
          print("Test 6: curl_cffi PATCH full payload:", r2.status_code)
          print(r2.text[:200])
          EOF

      - name: Run original script (control)
        env:
          DH_USER: ${{ secrets.DOCKERHUB_USERNAME }}
          DH_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          IMAGE_NAME: free-short-video
          RELEASE_VERSION: v6.3.0
        run: |
          python3 .github/scripts/update_dockerhub_overview.py
          echo "SCRIPT_EXIT=$?"
