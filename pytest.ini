[pytest]
# Agnes Video Generator — pytest 配置
# - asyncio 模式：测试中大量使用 async 协程，统一用 auto 模式省去逐个加 marker
# - testpaths：只扫 tests/，避免误收集根目录脚本
# - 默认 addopts：详细摘要 + 不捕获日志噪音（CI 中改由 coverage 驱动）
asyncio_mode = auto
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -ra -q -m "not slow"
markers =
    slow: 慢速/回归级集成测试（真实媒体处理或真实计时），默认排除；用 -m slow 显式运行，CI 通过 -o addopts 覆盖回全量
filterwarnings =
    ignore::DeprecationWarning
