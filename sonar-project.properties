# SonarCloud 分析配置（CI-based analysis，GitHub Actions 显式扫描）
# 项目 key 与组织由 SonarCloud 面板确定；SonarScanner 在 CI 中运行，
# 自动读取下方 sonar.python.coverage.reportPaths 指向的 coverage.xml 并随分析上报。

sonar.projectKey=lcy362_agnes-video-generator
sonar.organization=sandgrid
sonar.projectName=agnes-video-generator

# ── 分析范围 ──
# 后端 Python 源码（frontend/ 前端源码另由 JS/TS 分析器处理，见下）
# scripts/ 为一次性回归/运维工具（i18n 检查、回归 runner、GA4 配置），
# 不属于单测范围，排除出分析范围（避免其 0% 覆盖率稀释门禁）。
sonar.sources=core,web,models,utils,server.py

# 排除：测试代码、构建产物、运行时数据、依赖目录、回归/运维脚本
sonar.exclusions=**/node_modules/**,**/static/**,**/htmlcov/**,**/error_logs/**,**/images/**,**/tests/**,**/*.pyc,**/*.egg-info/**,**/scripts/**

# 测试代码不计入覆盖率分母（其本身不需要被测试）
sonar.coverage.exclusions=**/tests/**,**/test_*.py,**/*_test.py,**/mock_regression/**,**/scripts/**

# ── 语言 / Python 版本 ──
sonar.python.version=3

# ── 覆盖率报告路径（CI 中 pytest --cov 生成，SonarScanner 自动读取并上报）──
sonar.python.coverage.reportPaths=coverage.xml

# ── 源码编码 ──
sonar.sourceEncoding=UTF-8

# ── 重复代码阈值（保持默认，仅显式声明以便排查）──
sonar.cpd.python.minimumTokens=100

# ── Issue 豁免 ──
# S8541/S8544（workflows 中 pip install 未用 --only-binary / 未锁版本）：
# 依赖含 srt 等仅有 sdist 的纯 Python 包，强制 --only-binary :all: 会导致
# CI 安装失败（已验证），属事实约束而非疏漏；锁定全部版本需引入
# pip-tools lock 文件（改变版本范围维护策略），暂缓，故豁免这两条规则。
sonar.issue.ignore.multicriteria.e1.ruleKey=githubactions:S8541
sonar.issue.ignore.multicriteria.e1.resourceKey=**/*.yml
sonar.issue.ignore.multicriteria.e2.ruleKey=githubactions:S8544
sonar.issue.ignore.multicriteria.e2.resourceKey=**/*.yml
